[project]
name = "rst-forecast"
version = "0.1.0"
description = "Python forecasting service for the Right Sizing Tool"
readme = "README.md"
authors = [
    { name = "yanjia", email = "yanjiafelix@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydantic-settings>=2.14.2",
    "statsmodels>=0.14.6",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
rst-forecast = "rst_forecast.__main__:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=rst_forecast --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rst_forecast"]

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true
